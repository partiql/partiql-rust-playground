name: Code Coverage

on: [push, pull_request]

env:
  RUST_TEST_TIME_UNIT: 150,5000
  RUST_TEST_TIME_INTEGRATION: 150,5000

# Read-only token unless a job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    # We want to run on external PRs, but not on internal ones as push automatically builds
    # H/T: https://github.com/Dart-Code/Dart-Code/commit/612732d5879730608baa9622bf7f5e5b7b51ae65
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'partiql/partiql-rust-playground'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        # llvm-tools-preview is needed to generate source coverage
        run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      # Conformance tests are run with 'conformance_test' feature. Since step runs with 'all-features', the conformance
      # test are also run, which can cause `cargo test` to fail. Add 'continue-on-error' step to prevent GH Actions
      # failure.
      - name: Cargo Test w/ Coverage
        continue-on-error: true
        run: cargo llvm-cov --verbose --workspace --all-features --no-fail-fast --codecov --output-path codecov.json
      - name: Codecov Upload
        uses: codecov/codecov-action@v3
        with:
          files: codecov.json
          fail_ci_if_error: true
