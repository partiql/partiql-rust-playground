name: CI Build

# PR commits run once (as pull_request), not also as push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a PR cancels that PR's runs for older commits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token unless a job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS rather than cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo Build
        run: cargo build --verbose --workspace --locked
      - name: Cargo Test
        run: cargo test --verbose --workspace --locked
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-features --locked -- -D warnings

  wasm:
    name: Wasm build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Same compiler settings as the release; --no-opt skips wasm-opt, which dominates build time.
      - run: wasm-pack build --release --no-opt --target web --out-dir pkg-web -- --locked
      - run: node tests/smoke.mjs pkg-web
