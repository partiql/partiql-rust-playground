name: Release wasm package

# Pushing a tag `v<version>` (matching Cargo.toml, on main) builds the `--target web` wasm package and
# publishes it as a GitHub release asset, partiql-playground-web-<version>.tar.gz (+ .sha256), which
# partiql.github.io downloads at a pinned version and hash. Running the workflow manually builds the
# package and uploads it as a workflow artifact only, without creating a release.
#
# The build runs with a read-only token; only the publish job, which runs no project or dependency code,
# can write. Third-party actions are pinned by commit, and there is no build cache.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release-${{ github.ref }}

# Read-only token unless a job asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build takes ~10 minutes (most of it in wasm-opt); fail fast instead of the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tag is on main
          persist-credentials: false
      - name: Check the tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack@0.15.0,cargo-about@0.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build and package
        env:
          # Through env, not ${{ }} in the script: tag names may contain shell syntax. Empty for manual
          # runs, which build a local (unchecked) package.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/package-web.sh ${VERSION:+"$VERSION"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partiql-playground-web
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: partiql-playground-web
          path: dist/
      # Created as a draft and published only once the assets are uploaded, so a failed run can be
      # re-run. A published release is never modified: the website pins its asset's hash.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Release $TAG is already published. Release a new version instead."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
